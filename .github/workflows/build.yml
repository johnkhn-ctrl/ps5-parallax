          python3 - <<'PY'
          import base64, tarfile, io
          from pathlib import Path
          data = base64.b64decode(Path('/tmp/ps5-guard-kit.b64').read_text())
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as t:
              for member in t.getmembers():
                  safe = Path(member.name)
                  if safe.is_absolute() or '..' in safe.parts or not member.isfile():
                      raise SystemExit('Unsafe embedded filename')
              t.extractall('.', filter='data')
          print('Build-kit scripts extracted successfully')
          PY

      - name: Test popup blocker source patch
        shell: bash
        run: python3 -m unittest discover -s tests -v

      - name: Report build machine capacity
        shell: bash
        run: |
          uname -a
          df -h .
          echo 'Upstream Parallax requires compiling WebKit and many libraries.'
          echo 'Hosted macOS runners have very limited disk capacity.'

      - name: Build native PS5 homebrew title ZIP (not pkg)
        shell: bash
        run: |
          set -o pipefail
          bash ./build-shadowmount-macos.sh 2>&1 | tee build-log.txt

      - name: Upload installable title ZIP only if cross-build succeeds
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: parallax-popupguard-fw13-shadowmount-title
          path: parallax-browser/dist/parallax-browser-0.1.0-popupguard-fw13.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log for debugging (success or failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallax-popupguard-build-log
          path: build-log.txt
          if-no-files-found: ignore
          retention-days: 7
